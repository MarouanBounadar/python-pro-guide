name: Build and Release Executable

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pywebview

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --onefile --noconsole --name "PythonProGuide" --add-data "index.html;." --add-data "css;css" --add-data "js;js" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PythonProGuide-Windows
        path: dist/PythonProGuide.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/PythonProGuide.exe
        name: "Python Pro Guide Release"
        body: "Téléchargez le fichier PythonProGuide.exe pour exécuter l'application directement sur Windows sans rien installer !"
